<div class="min-h-screen bg-gray-100 py-10 px-4">
    <div class="max-w-5xl mx-auto bg-white shadow-lg rounded-2xl p-8">
        <div class="mb-8 text-center">
            <h1 class="text-4xl font-extrabold text-orange-500">
                Dragon Ball
            </h1>
            <p class="text-gray-500 mt-2">
                Manage your warriors list
            </p>
        </div>
        <section class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <dragon-ball-character-add 
                (newCharacter)="dragonBallService.addCharacter($event)"
            />
            <dragon-ball-character-list
                title="Characters List"
                [characters]="dragonBallService.characters()" />
        </section>
    </div>
</div>
