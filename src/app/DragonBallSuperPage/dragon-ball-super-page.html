<div class="min-h-screen bg-gray-100 py-10 px-4">
    <div class="max-w-5xl mx-auto bg-white shadow-lg rounded-2xl p-8">

        <!-- Title -->
        <div class="mb-8 text-center">
            <h1 class="text-4xl font-extrabold text-orange-500">
                Dragon Ball
            </h1>
            <p class="text-gray-500 mt-2">
                Manage your warriors list
            </p>
        </div>

        <!-- Content -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-8">

            <!-- Add Form -->
            <div class="bg-gray-50 p-6 rounded-xl border border-gray-200">
                <h2 class="text-2xl font-semibold text-gray-800 mb-5">
                    Add Character
                </h2>

                <div class="space-y-4">
                    <div>
                        <input
                            [value]="name()"
                            (input)="name.set(nameInput.value)"
                            #nameInput
                            type="text"
                            id="name"
                            placeholder="Character name"
                            required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-orange-400 transition" />
                    </div>
                    <div>
                        <input
                            [value]="power()"
                            (input)="power.set(powerInput.valueAsNumber)"
                            #powerInput
                            min=0
                            type="number"
                            id="power"
                            placeholder="Power level"
                            required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-orange-400 transition" />
                    </div>
                    <button
                        (click)="addCharacter()"
                        class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                        Add Character
                    </button>
                </div>
            </div>
            <!-- Characters List -->
            <dragon-ball-character-list [characters]="characters()" />
        </section>
    </div>
</div>
