<div class="min-h-[70vh] flex items-center justify-center bg-gray-100 p-6">
    <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md text-center">

        <!-- Title -->
        <h1 class="text-4xl font-extrabold text-gray-800 mb-2">
            Counter
        </h1>

        <p class="text-gray-500 mb-6">
            Simple Angular Counter with Tailwind
        </p>

        <!-- Counter Display -->
        <div class="bg-gray-50 border border-gray-200 rounded-xl py-6 mb-6">
            <p class="text-sm uppercase tracking-wide text-gray-400">
                Current Count
            </p>

            <h2 class="text-6xl font-bold text-blue-600 mt-2">
                {{ count() }}
            </h2>
        </div>

        <!-- Buttons -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">

            <button
                class="px-4 py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-xl shadow-md transition duration-200 active:scale-95"
                (click)="increment()">
                + Increment
            </button>

            <button
                class="px-4 py-3 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-xl shadow-md transition duration-200 active:scale-95"
                (click)="decrement()">
                - Decrement
            </button>

            <button
                class="px-4 py-3 bg-gray-700 hover:bg-gray-800 text-white font-semibold rounded-xl shadow-md transition duration-200 active:scale-95"
                (click)="reset()">
                Reset
            </button>

        </div>
    </div>
</div>
