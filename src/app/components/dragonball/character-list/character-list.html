<div class="bg-gray-50 p-6 rounded-xl border border-gray-200">
    <h2 class="text-2xl font-semibold text-gray-800 mb-5">
        Characters List
    </h2>

    <ul class="space-y-3">
        @for (character of characters(); track character.id; let i =
        $index) {
        <li
            class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border border-gray-100">
            <span class="font-medium text-gray-800">{{ i+1 }} - {{
                character.name }}</span>
            @if (character.power > 8000) {
            <span
                [ngClass]="{'text-orange-500 font-bold': character.power > 8000}">
                {{ character.power }}
            </span>
            }
            @else {
            <span>{{ character.power }}</span>
            }
        </li>
        }
    </ul>
</div>
